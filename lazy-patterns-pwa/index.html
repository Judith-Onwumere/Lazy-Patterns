<style>
:root{--surf:#fff;--pink:#f9c6d4;--rose:#e8718f;--deep:#b8456a;--cream:#fff8ef;--mint:#cdebd9;--sun:#ffe7a3;--ink:#5a3a46;--hm:'Happy Monkey','Patrick Hand','Segoe Print','Comic Sans MS',cursive;--ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--hd:'Caveat Brush','Segoe Print','Bradley Hand','Comic Sans MS',cursive;--bd:'Patrick Hand','Segoe Print','Bradley Hand','Comic Sans MS',cursive}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--hm);font-size:15px;color:var(--ink);background:var(--cream) linear-gradient(90deg,color-mix(in srgb,var(--pink) 25%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--pink) 25%,transparent) 50%,transparent 50%);background-size:36px 36px;min-height:100vh}
h1,h2,h3{font-family:var(--hm);font-weight:400;margin:0;color:var(--deep)}
button{font:inherit;cursor:pointer;border:0;background:var(--surf);color:var(--deep);border-radius:14px;padding:9px 14px;box-shadow:0 1px 4px #0001}
button:hover{background:var(--pink)}button.pri{background:var(--rose);color:#fff;border-style:solid}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--surf);border-bottom:3px dotted var(--rose);position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin-right:auto}select{font:inherit;border:2px solid var(--pink);border-radius:12px;padding:6px;max-width:200px;background:var(--surf);color:var(--ink)}
.wrap{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto}
nav{width:210px;flex:none;position:sticky;top:76px;align-self:flex-start}
nav button{display:flex;width:100%;gap:8px;margin-bottom:6px;text-align:left;border-style:solid;border-color:var(--pink)}
nav button.on{background:var(--rose);color:#fff;border-color:var(--rose)}nav .ok{margin-left:auto}
.bar{height:10px;border-radius:9px;background:var(--surf);overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--sun));transition:width .4s}
main{flex:1;min-width:0;background:var(--surf);border:3px solid var(--pink);border-radius:26px;padding:20px;box-shadow:6px 6px 0 var(--pink)}
main h2{font-size:26px;margin-bottom:0}.hint{opacity:.75;margin:0 0 14px;font-size:15px}
label{display:block;margin:18px 0 2px;font-size:16px;font-weight:400}
input,textarea{width:100%;font:inherit;color:var(--ink);border:2px solid transparent;border-radius:14px;padding:9px 11px;background:var(--surf)}
input:focus,textarea:focus{outline:0;border-color:var(--rose)}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}.row input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-radius:20px;border:0;padding:5px 12px;background:var(--surf);box-shadow:0 1px 4px #0001}.chip.on{background:var(--pink);color:var(--deep)}
.card{background:var(--surf);border:0;border-radius:18px;padding:12px;margin:12px 0;box-shadow:0 1px 4px #0001}
.cov{width:100%;max-width:300px;aspect-ratio:3/4;border:3px dashed var(--rose);border-radius:18px;background:var(--pink) center/cover;display:grid;place-items:center;text-align:center;cursor:pointer}
.stitchrow{display:grid;grid-template-columns:68px 1fr 70px 30px;gap:6px;align-items:start;margin-bottom:6px}
.rl{font-weight:800;color:var(--deep);background:var(--pink);border-radius:12px;padding:6px 10px;font-size:14px;white-space:nowrap;align-self:flex-start}.stitchrow textarea{min-height:44px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.s{opacity:1}
.wrap{flex-direction:column;max-width:780px}nav{width:auto;position:static;display:block!important}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.dot{width:14px;height:14px;border-radius:50%;background:var(--surf);border:2px solid var(--pink);cursor:pointer;display:inline-block}.dot.dn{background:var(--mint);border-color:#6bbf93}.dot.on{background:var(--rose);border-color:var(--rose);transform:scale(1.3)}
main{position:relative;overflow:clip}.pg{position:relative;overflow:hidden}main[data-wm]::after,.pg::after{content:attr(data-wm);position:absolute;inset:0;display:grid;place-items:center;text-align:center;transform:rotate(-28deg);font-family:var(--hd);font-size:clamp(40px,9vw,84px);color:var(--rose);opacity:.09;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero{text-align:center}.hero h2{font-size:32px}.big{display:grid;gap:12px;margin:20px auto;max-width:420px}.big button{font-size:24px;padding:16px;border-radius:20px}
.sw{display:inline-flex;gap:8px;align-items:center;margin:4px;border-radius:16px;padding:8px 12px;border:3px solid transparent;background:var(--surf);cursor:pointer}.sw.on{border-color:var(--deep)}.sw i{width:18px;height:18px;border-radius:50%;display:inline-block}
.saved{display:flex;align-items:center;gap:8px;padding:8px 12px;border:2px dashed var(--rose);border-radius:16px;margin-bottom:8px}.saved b{flex:1}
/* book */
.pg{background:#fff;border:3px solid var(--pink);border-radius:18px;padding:26px;margin-bottom:18px;page-break-after:always}
.pg h2{border-bottom:.6cqw dotted var(--rose);padding-bottom:.8cqw;margin-bottom:2cqw}.pg p,.pg li{white-space:pre-wrap}
.bc{text-align:center}.bc img{max-width:80%;border-radius:20px;border:6px solid var(--pink)}.bc h1{font-size:56px}
.ab{display:grid;grid-template-columns:90px 1fr;gap:2px 10px}.ab b{color:var(--deep)}
.pr{display:grid;grid-template-columns:5.6em 1fr auto;gap:1.6cqw;padding:.9cqw 0;border-bottom:.25cqw dotted var(--pink)}.pr b{font-family:var(--hd);color:var(--deep)}.pr em{color:var(--rose)}
.sheet{container-type:inline-size;aspect-ratio:210/297;max-width:540px;margin:0 auto 14px;display:flex;flex-direction:column;padding:0;box-shadow:3px 3px 0 #fff,4px 4px 0 var(--pink),7px 7px 0 #fff,8px 8px 0 var(--pink);touch-action:pan-y;user-select:none;font-family:var(--bd)}.sheet h1,.sheet h2,.sheet h3{font-family:var(--hd);font-weight:400}.sheet.fn{animation:flN .4s}.sheet.fp{animation:flP .4s}
@keyframes flN{from{opacity:0;transform:perspective(900px) rotateY(16deg) translateX(30px)}}@keyframes flP{from{opacity:0;transform:perspective(900px) rotateY(-16deg) translateX(-30px)}}
@keyframes fl{from{opacity:0;transform:perspective(900px) rotateY(-18deg)}to{opacity:1;transform:none}}
.sheet .body{flex:1;overflow:hidden;padding:4.8cqw 4.8cqw 0;font-size:2.95cqw}.sheet h2{font-size:2em}.sheet h3{font-size:1.3em;margin:.5em 0 .2em}.sheet p{margin:.25em 0}
.sheet .fo{display:flex;justify-content:space-between;font-size:2.5cqw;opacity:.7;border-top:.4cqw dotted var(--pink);padding-top:.8cqw;margin:1.2cqw 4.8cqw 3cqw}
.bc .body{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.bc h1{font-size:2.8em}.bc img{width:62%;aspect-ratio:3/4;object-fit:cover}
.flip{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px;font-weight:800;font-size:16px}.flip button{font-size:22px}.flip button:disabled{opacity:.3}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:16px}.em{font-size:28px;width:56px;height:56px;border-radius:18px;background:var(--pink);display:grid;place-items:center;flex:none}.hd .hint{margin:2px 0 0}
.rowc{display:flex;gap:10px;background:var(--surf);border:0;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 1px 4px #0001}.rowc>div{flex:1;min-width:0}.rowc textarea{min-height:56px}.rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.rt input{width:110px;flex:none}
.th{display:flex;gap:10px;align-items:center;margin-top:8px}.th img{height:64px;border-radius:10px;border:2px solid var(--pink)}.stk{position:sticky;top:8px;background:var(--cream);padding:6px 0;z-index:3}
.ri{display:block;margin:.5em auto .7em;max-width:100%;object-fit:cover;border-radius:3cqw;border:.5cqw solid var(--pink)}.dotc{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-right:.3em;border:1px solid #0003}
.dotp{width:28px;height:28px;border-radius:50%;border:2px solid #0003;cursor:pointer;display:inline-block}.cpn{background:var(--cream);border:2px solid var(--pink);border-radius:14px;padding:10px;margin-top:6px}.cpn .chips{margin-bottom:8px}.sb{min-width:96px;flex:none}
.rowc.note{background:var(--bg)}.ins{display:block;margin:-2px auto 8px;font-size:13px;padding:3px 12px;border-style:dashed;opacity:.85}.nt{background:var(--cream);border-left:.8cqw solid var(--rose);padding:.25em .6em;border-radius:1.2cqw;font-style:italic;margin:.4em 0}
body{background:var(--bg)}header{display:none}.wrap{padding:0;max-width:640px}main{background:transparent;border:0;box-shadow:none;padding:8px 16px 120px;border-radius:0}nav{padding:16px 16px 0}nav:empty{padding:0}
.panel{background:var(--cream);border-radius:22px;padding:18px;box-shadow:0 2px 6px #0001;margin-bottom:16px}.stp{display:flex;justify-content:space-between;font-size:13px;margin:16px 0 6px;color:var(--deep)}
.pill{flex:1;height:48px;border-radius:24px;border:0;box-shadow:0 4px 14px #0002;font-size:17px;background:var(--surf);color:var(--deep)}.pill.pri{background:var(--rose);color:#fff}
.hm,.bar2{font-family:var(--hm);color:var(--ink)}.hm h1{font-family:var(--hm);font-weight:400;font-size:28px;color:var(--ink);margin:22px 0 6px}
.tb{position:relative;display:flex;justify-content:space-between}.cb{width:48px;height:48px;border-radius:50%;background:var(--surf);border:0;box-shadow:0 4px 14px #0002;display:grid;place-items:center;padding:0;color:var(--deep);flex:none}.cb:hover{background:#fafafa}
.mh{font-family:var(--hm);font-weight:400;font-size:16px;margin:22px 0 10px;color:var(--ink)}
.pc{background:var(--cream);border-radius:20px;padding:12px 12px 12px 14px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 6px #0001}.pc h3,.li h3{font-family:var(--hm);font-weight:400;color:var(--ink)}
.pc.c{display:flex;gap:12px;justify-content:space-between;min-height:150px}.pc.c .tx{display:flex;flex-direction:column;flex:1;min-width:0}.pc.c h3{font-size:18px;margin:2px 0 6px}.pc.c p{margin:0;font-size:16px}.pc.c .bd{margin-top:auto;align-self:flex-start}.pc.c img{width:120px;height:136px;object-fit:cover;border-radius:14px;flex:none}
.bd{background:var(--pink);border-radius:8px;padding:2px 9px;font-size:13px;display:inline-block}
.pgd{columns:2;column-gap:12px}.pc.g{break-inside:avoid;padding:12px}.pc.g img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;margin-bottom:8px}.pc.g h3{font-size:15px;margin:0 0 4px}.pc.g p{margin:0 0 8px;font-size:14px}

an class="rl">Section</span><div class="pab"><select data-sk="${ri}" data-pi="${pi}">${['Rnd','Row'].map(o=>`<option ${ck==o?'selected':''}>${o}</option>`).join('')}</select><button class="ib red" data-a="dr" data-pi="${pi}" data-ri="${ri}" title="Delete section">${IC.del}</button></div></div><input data-r="${ri}" data-pi="${pi}" value="${esc(r.t)}" placeholder="Section name, e.g. Base, Sides, Straps"></div>`}if(r.txt)return `<div class="rowc v txtc"><div class="rh"><span class="rl">${IC.txt} Text</span><div class="pab"><button class="ib red" data-a="dr" data-pi="${pi}" data-ri="${ri}" title="Delete text">${IC.del}</button></div></div><textarea data-r="${ri}" data-pi="${pi}" placeholder="Write anything here: a tip, an explanation or a description">${esc(r.t)}</textarea></div>`;if(r.note)return `<div class="rowc v note"><div class="rh"><span class="rl">${IC.info} Note</span><div class="pab"><button class="ib red" data-a="dr" data-pi="${pi}" data-ri="${ri}" title="Delete">${IC.del}</button></div></div><textarea data-r="${ri}" data-pi="${pi}" placeholder="Instruction between ${kd}s, e.g. Change to colour B. Stuff firmly.">${esc(r.t)}</textarea></div>`;const st=k+1,en=+r.e>st?+r.e:st;k=en;return `<div class="rowc v"><div class="rh"><div class="rlab"><span class="rl">${ck} ${st}</span><span class="to">to<input type="number" inputmode="numeric" data-re="${ri}" data-pi="${pi}" min="${st+1}" value="${r.e||''}" placeholder="–"></span></div></div><textarea data-r="${ri}" data-pi="${pi}" placeholder="What do you crochet in this ${ck.toLowerCase()}? e.g. 6 sc in mr">${esc(r.t)}</textarea><input class="sc" data-rn="${ri}" data-pi="${pi}" value="${esc(r.n)}" placeholder="Stitch count">${thr(r,pi,ri)}<div class="pab rbar"><button class="ib" data-a="an" data-pi="${pi}" data-ri="${ri}" title="Add an instruction after this ${kd}">${IC.info}</button><button class="ib" data-a="atx" data-pi="${pi}" data-ri="${ri}" title="Add text after this ${ck.toLowerCase()}">${IC.txt}</button><button class="ib cam" data-a="rimg" data-pi="${pi}" data-ri="${ri}" title="Add photos">${IC.cam}</button><button class="ib red" data-a="dr" data-pi="${pi}" data-ri="${ri}" title="Delete">${IC.del}</button></div></div>`}).join('')})()+`<button data-a="ar" data-pi="${pi}" class="pri">＋ Add ${ak}</button> <button data-a="asec" data-pi="${pi}">＋ Add section</button> <button data-a="atx" data-pi="${pi}" data-ri="${p.rows.length-1}">＋ Add text</button>`},

if(gi<0){if(!(yd.b||'').trim()){if(!sil)toast('Add the yarn brand first');return false}G.push({n:yd.b.trim(),p:yd.p||'',items:[]});gi=G.length-1}
if(ed)G[gi].items[ye.ii]=it;else G[gi].items.push(it);lastY=gi;lastYi=ed?ye.ii:G[gi].items.length-1;yd={gi};ye=null;yp=-1;return true}
function yform(){const G=P.yarnG,ed=ye&&ye.gi!==undefined;let gi=yd.gi==null?(G.length?G.length-1:-1):+yd.gi;if(gi>=G.length)gi=-1;
return `<div class="card" id="yform"><label style="margin:0 0 4px">Brand</label><select data-ygi ${ed?'disabled':''}><option value="-1" ${gi<0?'selected':''}>＋ New brand…</option>${G.map((g,i)=>`<option value="${i}" ${gi==i?'selected':''}>${esc(g.n)}${g.p?' · '+esc(g.p):''}</option>`).join('')}</select>${gi<0?`<div class="row" style="margin-top:10px"><input data-y="b" value="${esc(yd.b||'')}" placeholder="Brand / yarn name, e.g. Milk cotton yarn"><select data-y="p"><option value="">Ply</option>${PLY.map(o=>`<option ${yd.p==o?'selected':''}>${o}</option>`).join('')}</select></div>`:''}<input data-y="l" style="margin-top:10px" value="${esc(yd.l||'')}" placeholder="Colour name, e.g. Yellow"><div class="row" style="margin-top:10px"><div class="unit"><input data-y="q" data-i="0" inputmode="decimal" value="${esc(yd.q)}" placeholder="Quantity"><span>balls</span></div><div class="unit"><input data-y="g" data-i="0" inputmode="decimal" value="${esc(yd.g)}" placeholder="Weight each"><span>g each</span></div></div><div class="row"><input data-y="k" data-i="0" value="${esc(yd.k)}" placeholder="Colour code"><button class="sb" data-a="yc" data-i="0">${sbl(yd.c)}</button></div>${yp==0?`<div class="cpn ycol"><div class="chips">${PAL.map(c=>`<span class="dotp" data-a="pc" data-i="0" data-c="${c}" style="background:${c}"></span>`).join('')}</div><div class="row"><input type="color" data-y="c" data-i="0" value="${hx(yd.c).length==7?hx(yd.c):'#e8718f'}" style="width:52px;flex:none;padding:2px;height:42px"><input data-y="c" data-i="0" value="${esc(yd.c)}" placeholder="#hex code" style="max-width:130px;flex:none"><button data-a="yc" data-i="0">Done</button></div></div>`:''}<div class="row" style="margin:12px 0 0"><button class="pri" data-a="ay">${ed?'Save changes':'＋ Add colour'}</button>${ed?'<button data-a="yx">Cancel</button>':''}</div></div>`}
function toFirst(){flushMat();sec=SEC[0][0];an=3;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}render();window.scrollTo(0,0);toast('Back to step 1')}
function fit(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{document.querySelectorAll('textarea').forEach(fit);if((view=='wiz'&&(sec=='prev'||sec=='aes'))||fs)render()});
function showPa(id){const p=D.list.find(x=>x.id==id);if(!p)return;const o=$('#phs');o.innerHTML=`<div class="sh" data-a="pnone"><b>${esc(p.title||'Untitled pattern')}</b><button data-a="vw" data-id="${id}">${IC.eye} View pattern</button><button class="rd" data-a="dl2" data-id="${id}">${IC.del} Delete pattern</button><button data-a="pcancel">Cancel</button></div>`;o.hidden=false}
function showPh(){const o=$('#phs');o.innerHTML=`<div class="sh" data-a="pnone"><b>Add a photo</b><button data-a="pcam">${IC.cam} Take a photo</button><button data-a="pfile">${IC.img} Choose from gallery or files</button><button data-a="pcancel">Cancel</button></div>`;o.hidden=false}
const onPhoto=async e=>{const fs_=[...e.target.files];if(!fs_.length)return;const t=ptgt,list=t=='cover'?fs_.slice(0,1):fs_,us=(await Promise.all(list.map(f=>new Promise(ok=>pick(f,0,ok))))).filter(Boolean);setTimeout(()=>e.target.value='',800);if(!us.length)return;if(t=='cover'){P.cover=us[0];P.thumb='';toast('Cover photo added 🌸')}else if(t=='con')us.forEach(u=>P.con.push({img:u,t:''}));else if(t=='gal')us.forEach(u=>P.gal.push({img:u,t:''}));else{const p=P.parts[t[0]],o=t[1]<0?p:p.rows[t[1]];ims(o).push(...us)}save();render();if(t=='cover')ensureThumbs()};
$('#pf').onchange=onPhoto;$('#pc').onchange=onPhoto;
const DB={o(){return this.p||(this.p=new Promise((ok,no)=>{const r=indexedDB.open('lazy-patterns',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},async get(k){const d=await this.o();return new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},async set(k,v){const d=await this.o();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}};
async function boot(){let d=null;try{d=await DB.get(KEY)}catch(e){}if(!d){try{const r=localStorage.getItem(KEY);if(r)d=JSON.parse(r)}catch(e){}}if(d&&d.list)D=d;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
boot().then(()=>{load();try{const r=JSON.parse(localStorage.getItem('lazy-resume')||'null');if(r&&r.v=='wiz'&&r.pid){const p=D.list.find(x=>x.id==r.pid);if(p){P=p;D.cur=p.id;sec=r.sec&&r.sec!='prev'?r.sec:(LAST[p.id]||'cover');view='wiz'}}}catch(e){}render();ensureThumbs()});
</script></body></html>
